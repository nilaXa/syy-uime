<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <nav>
      <a href="/">Home</a>
      <a href="/orders">Orders</a>
      <a href="/products">Products</a>
      <a href="/customers">Customers</a>
    </nav>
  </header>

  <main>
    <h1>Customers</h1>
    <form id="customer-form" class="card">
      <div class="field">
        <!-- Intentional missing label -->
        <input type="text" id="customer-name" placeholder="Customer name">
      </div>
      <div class="field">
        <input type="email" id="customer-email" placeholder="Email" aria-label="Email address">
      </div>
      <button type="submit" data-testid="submit-customer" class="btn btn-">Add Customer</button>
    </form>
    <div data-testid="success-message" class="success-message hidden">Customer added successfully.</div>
  </main>

  <script type="module" src="/customers.js"></script>
</body>
</html>
